name: Sugestão
description: Uma ideia de melhoria para o Rapdex
title: "[ideia] "
labels: ["sugestão"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que incômodo isso resolve
      description: Descreva a situação em que você sentiu falta, não a solução.
    validations:
      required: true
  - type: textarea
    id: ideia
    attributes:
      label: Como você imagina que funcionaria
