name: "Sugestão · Suggestion"
description: "Uma ideia de melhoria · An idea to improve Rapdex"
title: "[ideia] "
labels: ["sugestão"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que incômodo isso resolve · What annoyance does it solve
      description: "Descreva a situação, não a solução · Describe the situation, not the solution"
